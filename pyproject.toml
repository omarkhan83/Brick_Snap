[project]
name = "bricksnap"
version = "0.1.0"
description = "Turn any 3D model into a designed set of real LEGO-compatible bricks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "trimesh>=4.4",
    "networkx>=3.3",
    "pillow>=10.4",
    "lxml>=5.2",
    "mcp>=2",
]

[project.scripts]
bricksnap = "bricksnap.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "ty",
    "playwright>=1.47",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bricksnap"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy", "viewer/vendor", "tools/catalog", ".worktrees", "docs/research"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ty.src]
exclude = ["legacy", "tools/catalog", "viewer", ".worktrees", "docs/research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: drives the viewer page in headless Chromium",
    "designer: starts a real AI design run through headless Claude Code (uses subscription quota)",
    "thorough: slow, thorough sweeps; run with -m thorough before closing a stage",
]
addopts = "-m 'not designer and not thorough'"
